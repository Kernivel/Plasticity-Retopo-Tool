site_name: Plasticity Retop
site_description: Patch-based retopology for CAD meshes in Blender
site_url: https://kernivel.github.io/Plasticity-Retopo-Tool/
repo_url: https://github.com/Kernivel/Plasticity-Retopo-Tool
# 'GitHub' exactly: the theme's versions.html special-cases that value and
# renders a short icon link. Any other string falls through to a branch that
# prints the name in full, inside the fixed 300px bar at the foot of the
# sidebar -- where a long one wraps onto three lines and collides with the
# Previous/Next links.
repo_name: GitHub
# MkDocs assumes 'master'; this repository's branch is main, so the theme's
# 'Edit on GitHub' link on every page 404s without this.
edit_uri: edit/main/docs/
copyright: Plasticity Retop is an independent project, not affiliated with Plasticity.

# The addon package lives at the repository root, so the docs sit in a
# subfolder and everything else is left alone.
docs_dir: docs
site_dir: site

# Ships with MkDocs itself, so requirements-docs.txt stays to two lines.
# It understands plain Markdown plus admonitions and nothing else -- no icons,
# no content tabs, no collapsible blocks, no Mermaid. The pages are written to
# that limit deliberately; adding an extension the theme cannot style produces
# a page that builds cleanly and reads as broken.
theme:
  name: readthedocs

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # Click an image to open it full size. Videos are untouched by it.
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      draggable: true

markdown_extensions:
  # MkDocs always adds toc, tables and fenced_code on top of these.
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Your first patch: first-patch.md
      - General: general.md
  - Guide:
      - Matching a neighbour: guide/matching.md
      - One patch, several surfaces: guide/multi-surface.md
      - N-gon mode: guide/ngon.md
      - Faces with a hole: guide/rings.md
      - Symmetry: guide/symmetry.md
      - Hand-editing the result: guide/hand-editing.md
      - Seeing the CAD structure: guide/cad-structure.md
  - How it works:
      - Overview: how-it-works/index.md
      - 1. Identifying a patch: how-it-works/patches.md
      - 2. Choosing a generator: how-it-works/generators.md
      - 3. Matching a neighbour: how-it-works/matching.md
      - 4. Committing: how-it-works/commit.md
  - Reference:
      - Keymap: reference/keymap.md
      - The N-panel: reference/panel.md
      - Troubleshooting: reference/troubleshooting.md
  - Contributing:
      - Development: contributing/development.md
      - Recording media: contributing/media.md
